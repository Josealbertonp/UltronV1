[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultronresearch"
version = "2.0.0rc2"
description = "Ultron RC2 Phase 2 — Research Lab (dataset analysis, no ML training)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ultronresearch = "ultronresearch.cli.run_research:main"
ultronresearch-shadow = "ultronresearch.cli.run_shadow:main"
ultronresearch-filter = "ultronresearch.cli.run_filter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultronresearch*"]
