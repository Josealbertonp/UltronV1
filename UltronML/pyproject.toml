[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultronml"
version = "2.0.0-rc2"
description = "Ultron RC2 — ML infrastructure (dataset, validation, providers). No training in Phase 1."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ultronml-export = "ultronml.cli.export_dataset:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultronml*"]
